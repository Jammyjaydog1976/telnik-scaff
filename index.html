<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Telnik Scaff</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:#fff;padding:18px 16px 15px;text-align:center}.logo{font-size:32px;font-weight:900;letter-spacing:2px}.logo span{color:#f59e0b}.subtitle{font-size:13px;color:#d1d5db}
nav{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:10}nav button{border:0;background:#fff;padding:14px 15px;font-weight:700;white-space:nowrap;cursor:pointer}nav button.active{color:#b45309;border-bottom:3px solid #f59e0b}
main{max-width:900px;margin:auto;padding:16px}.page{display:none}.page.active{display:block}h2{margin:4px 0 14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:12px}.stat{text-align:center;cursor:pointer}.stat .number{font-size:32px;font-weight:900}.danger{color:#dc2626}.warning{color:#d97706}.good{color:#15803d}
button.primary,.action{width:100%;border:0;border-radius:10px;padding:13px;font-size:16px;font-weight:800;cursor:pointer;margin-top:8px}.primary{background:#111827;color:#fff}.action{background:#f59e0b;color:#111827}.secondary{border:1px solid #ccc;background:#fff;border-radius:9px;padding:10px 12px;font-weight:700;cursor:pointer}.delete{border:0;background:#fee2e2;color:#991b1b;border-radius:9px;padding:10px;font-weight:700;cursor:pointer}
input,textarea{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ccc;border-radius:9px;font-size:16px;background:#fff}textarea{min-height:90px;resize:vertical}label{font-weight:700;font-size:14px}.job-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.small{font-size:13px;color:#6b7280}.badge{display:inline-block;padding:5px 8px;border-radius:20px;font-size:12px;font-weight:800;margin-top:5px}.badge.red{background:#fee2e2;color:#991b1b}.badge.amber{background:#fef3c7;color:#92400e}.badge.green{background:#dcfce7;color:#166534}.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.photo-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #eee}.check input{width:auto;margin-top:3px}hr{border:0;border-top:1px solid #eee;margin:16px 0}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header><div class="logo">TELNIK <span>SCAFF</span></div><div class="subtitle">Scaffold Management</div></header>
<nav><button onclick="showPage('today',this)" class="active">Today</button><button onclick="showPage('register',this)">Scaffolds</button><button onclick="showPage('add',this)">Add Job</button><button onclick="showPage('checklist',this)">New Job Checklist</button><button onclick="showPage('costing',this)">Costing</button></nav>
<main>
<section id="today" class="page active"><h2>Today</h2><div class="grid">
<div class="card stat" onclick="showFiltered('overdue')"><div class="number danger" id="overdueCount">0</div><b>Overdue Tags</b></div>
<div class="card stat" onclick="showFiltered('today')"><div class="number warning" id="todayCount">0</div><b>Due Today</b></div>
<div class="card stat" onclick="showFiltered('soon')"><div class="number" id="soonCount">0</div><b>Due Next 2 Days</b></div>
<div class="card stat" onclick="showPage('register')"><div class="number good" id="totalCount">0</div><b>Live Scaffolds</b></div></div>
<div class="card"><h3 style="margin-top:0">Priority Jobs</h3><div id="priorityJobs"></div></div></section>

<section id="register" class="page"><h2>Scaffold Register</h2><div id="filterTitle" class="small"></div><div id="scaffoldList"></div></section>

<section id="add" class="page"><h2>Add Scaffold Job</h2><div class="card">
<label>Job / Site Name</label><input id="jobName" placeholder="e.g. Flint House">
<label>Address</label><textarea id="jobAddress" placeholder="Full site address"></textarea>
<label>Job ID</label><input id="jobId" placeholder="e.g. 2609-1626">
<label>Erection / Last Tag Date</label><input id="jobDate" type="date">
<label>Contact / Notes</label><textarea id="jobNotes" placeholder="Access details, contact, scaffold notes..."></textarea>
<button class="primary" onclick="addJob()">Save Job</button></div></section>

<section id="jobDetail" class="page"><button class="secondary" onclick="showPage('register')">← Back to Register</button><div id="jobDetailContent" style="margin-top:12px"></div></section>

<section id="checklist" class="page"><h2>New Job Checklist</h2><div class="card">
<label>Site / Job</label><input id="checkSite" placeholder="Site name or address"><div id="checkItems"></div>
<label style="display:block;margin-top:14px">Measurements / Tight Spots</label><textarea id="measurements"></textarea>
<label>Extra Notes</label><textarea id="checkNotes"></textarea>
<button class="primary" onclick="saveChecklist()">Save Checklist</button></div></section>

<section id="costing" class="page"><h2>Quick Scaffold Costing</h2><div class="card">
<label>Length (metres)</label><input id="length" type="number" oninput="calculatePrice()">
<label>Height (metres)</label><input id="height" type="number" oninput="calculatePrice()">
<label>Rate per m² (£)</label><input id="rate" type="number" value="35" oninput="calculatePrice()">
<label>Extras (£)</label><input id="extras" type="number" value="0" oninput="calculatePrice()"><hr>
<div class="small">Area</div><div style="font-size:24px;font-weight:900" id="areaResult">0 m²</div>
<div class="small" style="margin-top:12px">Suggested Price</div><div style="font-size:32px;font-weight:900" id="priceResult">£400</div>
<div class="small">Minimum job price currently set at £400.</div></div></section>
</main>
<script>
const db=JSON.parse(localStorage.getItem("telnikScaffDB"))||{scaffolds:[],checklists:[]};
function saveDB(){localStorage.setItem("telnikScaffDB",JSON.stringify(db))}
function parseDate(s){return new Date(s+"T12:00:00")}
function nextDate(s){const d=parseDate(s);d.setDate(d.getDate()+7);return d}
function daysUntil(date){const now=new Date();now.setHours(12,0,0,0);const d=new Date(date);d.setHours(12,0,0,0);return Math.round((d-now)/86400000)}
function formatDate(d){return d.toLocaleDateString("en-GB")}
function statusFor(j){const d=daysUntil(nextDate(j.date));if(d<0)return{text:`OVERDUE ${Math.abs(d)} DAY${Math.abs(d)==1?"":"S"}`,cls:"red",days:d};if(d===0)return{text:"DUE TODAY",cls:"red",days:d};if(d<=2)return{text:`DUE IN ${d} DAY${d==1?"":"S"}`,cls:"amber",days:d};return{text:`DUE IN ${d} DAYS`,cls:"green",days:d}}
function showPage(id,btn){document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));if(btn)btn.classList.add("active");if(id==="register")renderScaffolds();if(id==="today")renderDashboard();window.scrollTo(0,0)}
function addJob(){const name=jobName.value.trim(),address=jobAddress.value.trim(),id=jobId.value.trim(),date=jobDate.value,notes=jobNotes.value.trim();if(!name||!date){alert("Add the site name and erection/tag date first.");return}db.scaffolds.push({uid:Date.now(),name,address,jobId:id,date,notes,photos:[]});saveDB();jobName.value=jobAddress.value=jobId.value=jobDate.value=jobNotes.value="";renderDashboard();showPage("register")}
function jobCard(j){const s=statusFor(j);return `<div class="card"><div class="job-head"><div><b style="font-size:18px">${esc(j.name)}</b>${j.jobId?`<div class="small">Job ID: ${esc(j.jobId)}</div>`:""}<span class="badge ${s.cls}">${s.text}</span></div></div>${j.address?`<p>${esc(j.address)}</p>`:""}<div class="small">Last tag: ${formatDate(parseDate(j.date))}<br>Next tag: ${formatDate(nextDate(j.date))}</div><button class="action" onclick="openJob(${j.uid})">Open Job</button>${j.address?`<button class="primary" onclick="openMaps('${encodeURIComponent(j.address)}')">Navigate to Site</button>`:""}</div>`}
function renderScaffolds(filter="all"){let jobs=[...db.scaffolds];if(filter==="overdue")jobs=jobs.filter(j=>statusFor(j).days<0);if(filter==="today")jobs=jobs.filter(j=>statusFor(j).days===0);if(filter==="soon")jobs=jobs.filter(j=>statusFor(j).days>0&&statusFor(j).days<=2);jobs.sort((a,b)=>statusFor(a).days-statusFor(b).days);filterTitle.innerHTML=filter==="all"?"All current scaffolds":`Filtered jobs &nbsp; <button class="secondary" onclick="renderScaffolds()">Show All</button>`;scaffoldList.innerHTML=jobs.length?jobs.map(jobCard).join(""):`<div class="card">No jobs in this section.</div>`}
function showFiltered(t){showPage("register");renderScaffolds(t)}
function renderDashboard(){const ss=db.scaffolds.map(statusFor);overdueCount.textContent=ss.filter(s=>s.days<0).length;todayCount.textContent=ss.filter(s=>s.days===0).length;soonCount.textContent=ss.filter(s=>s.days>0&&s.days<=2).length;totalCount.textContent=db.scaffolds.length;const p=[...db.scaffolds].filter(j=>statusFor(j).days<=2).sort((a,b)=>statusFor(a).days-statusFor(b).days);priorityJobs.innerHTML=p.length?p.map(j=>{const s=statusFor(j);return `<div style="padding:10px 0;border-bottom:1px solid #eee;cursor:pointer" onclick="openJob(${j.uid})"><b>${esc(j.name)}</b><br><span class="badge ${s.cls}">${s.text}</span></div>`}).join(""):`<div class="small">Nothing urgent. You're all caught up.</div>`}
function openJob(uid){const j=db.scaffolds.find(x=>x.uid===uid);if(!j)return;const s=statusFor(j);jobDetailContent.innerHTML=`<div class="card"><h2>${esc(j.name)}</h2>${j.jobId?`<div class="small">Job ID: ${esc(j.jobId)}</div>`:""}<span class="badge ${s.cls}">${s.text}</span>${j.address?`<p>${esc(j.address)}</p>`:""}<p class="small">Last tag: ${formatDate(parseDate(j.date))}<br>Next inspection: ${formatDate(nextDate(j.date))}</p>${j.address?`<button class="action" onclick="openMaps('${encodeURIComponent(j.address)}')">Open Maps / Drive Here</button>`:""}<button class="primary" onclick="renewTag(${uid})">Tag Updated Today</button><hr><label>Job Notes</label><textarea id="detailNotes">${esc(j.notes||"")}</textarea><button class="secondary" onclick="saveNotes(${uid})">Save Notes</button><hr><h3>Site Photos</h3><input type="file" accept="image/*" capture="environment" onchange="addPhoto(event,${uid})"><div class="photo-grid">${(j.photos||[]).map((p,i)=>`<img src="${p}" onclick="removePhoto(${uid},${i})">`).join("")}</div><hr><button class="delete" onclick="deleteJob(${uid})">Delete Job</button></div>`;showPage("jobDetail")}
function renewTag(uid){const j=db.scaffolds.find(x=>x.uid===uid),n=new Date();j.date=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`;saveDB();renderDashboard();openJob(uid)}
function saveNotes(uid){db.scaffolds.find(x=>x.uid===uid).notes=detailNotes.value;saveDB();alert("Notes saved.")}
function deleteJob(uid){if(!confirm("Delete this scaffold job?"))return;db.scaffolds=db.scaffolds.filter(x=>x.uid!==uid);saveDB();renderDashboard();showPage("register")}
function openMaps(a){window.open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(decodeURIComponent(a)),"_blank")}
function addPhoto(e,uid){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=x=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas");let w=img.width,h=img.height,max=900;if(w>h&&w>max){h=Math.round(h*max/w);w=max}else if(h>=w&&h>max){w=Math.round(w*max/h);h=max}c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);const j=db.scaffolds.find(x=>x.uid===uid);j.photos=j.photos||[];j.photos.push(c.toDataURL("image/jpeg",.65));try{saveDB();openJob(uid)}catch(err){j.photos.pop();alert("App photo storage is full.")}};img.src=x.target.result};r.readAsDataURL(f)}
function removePhoto(uid,i){if(!confirm("Delete this photo?"))return;const j=db.scaffolds.find(x=>x.uid===uid);j.photos.splice(i,1);saveDB();openJob(uid)}
const checklistItems=["Ground condition suitable","Any obstructions","Overhead power cables","Need to contact electricity network / power company","Need to speak to neighbours","Measure tight spots / restricted areas","Good lorry access","Transit required instead of lorry","Ladder gates required","Safe ladder position","Public protection required","Pedestrian access / pavement issues","Roof hazards / fragile surfaces","Loading bays required","Any asbestos concerns","Other general hazards identified"];
function renderChecklist(){checkItems.innerHTML=checklistItems.map((x,i)=>`<label class="check"><input type="checkbox" id="check${i}"><span>${x}</span></label>`).join("")}
function saveChecklist(){const site=checkSite.value.trim();if(!site){alert("Add the site name first.");return}db.checklists.push({uid:Date.now(),site,checked:checklistItems.filter((x,i)=>document.getElementById("check"+i).checked),measurements:measurements.value,notes:checkNotes.value,created:new Date().toISOString()});saveDB();alert("Site visit checklist saved.");checkSite.value=measurements.value=checkNotes.value="";renderChecklist()}
function calculatePrice(){const l=parseFloat(length.value)||0,h=parseFloat(height.value)||0,r=parseFloat(rate.value)||0,e=parseFloat(extras.value)||0,a=l*h;let p=a*r+e;if(p<400)p=400;areaResult.textContent=a.toFixed(1)+" m²";priceResult.textContent="£"+Math.round(p).toLocaleString("en-GB")}
function esc(s){return String(s||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
renderChecklist();renderDashboard();renderScaffolds();calculatePrice();
</script>
</body>
</html>
